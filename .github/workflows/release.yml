name: Release BSP Skills

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate-skills.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pack BSP skill and installers
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python ci/build_release.py --ref HEAD --version "$RELEASE_VERSION" --output-dir release-assets
          echo "zip_name=release-assets/bsp-skill-${RELEASE_VERSION}.zip" >> "$GITHUB_ENV"
          echo "tar_name=release-assets/bsp-skill-${RELEASE_VERSION}.tar.gz" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.zip_name }}
            ${{ env.tar_name }}
          generate_release_notes: true

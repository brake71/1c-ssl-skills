name: Release BSP Skills

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack BSP skill and installers
        run: |
          ZIP_NAME="bsp-skill-${{ github.ref_name }}.zip"
          TAR_NAME="bsp-skill-${{ github.ref_name }}.tar.gz"
          zip -r "$ZIP_NAME" skills/bsp install.sh install.ps1
          tar -czf "$TAR_NAME" skills/bsp install.sh install.ps1
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "tar_name=$TAR_NAME" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.zip_name }}
            ${{ env.tar_name }}
          generate_release_notes: true
